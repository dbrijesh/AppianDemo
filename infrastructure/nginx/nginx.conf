events { worker_connections 1024; }

http {
  upstream audit_core    { server audit-core:8001; }
  upstream esign         { server esign:8002; }
  upstream identity      { server identity:8003; }
  upstream workflow      { server workflow-engine:8004; }
  upstream tasks         { server task-service:8005; }
  upstream agents        { server agent-service:8006; }
  upstream llm_gateway   { server llm-gateway:8007; }

  server {
    listen 80;

    location /api/v1/audit/    { proxy_pass http://audit_core/v1/; proxy_set_header Host $host; }
    location /api/v1/esign/    { proxy_pass http://esign/v1/; proxy_set_header Host $host; }
    location /api/v1/identity/ { proxy_pass http://identity/v1/; proxy_set_header Host $host; }
    location /api/v1/workflow/ { proxy_pass http://workflow/v1/; proxy_set_header Host $host; }
    location /api/v1/tasks/    { proxy_pass http://tasks/v1/; proxy_set_header Host $host; }
    location /api/v1/agents/   { proxy_pass http://agents/v1/; proxy_set_header Host $host; }
    location /api/v1/llm/      { proxy_pass http://llm_gateway/v1/; proxy_set_header Host $host; }

    location /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }
  }
}
